name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://books.koalasoft.se
    permissions:
      packages: read

    steps:
      - uses: actions/checkout@v7

      - name: Copy compose files to VM
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.yml,Caddyfile"
          target: /opt/koalabooks

      - name: Copy db-init scripts to VM
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "db-init/*"
          target: /opt/koalabooks/db-init
          strip_components: 1

      - name: Pull and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd /opt/koalabooks
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
        env:
          # GHCR_PAT is a durable classic PAT (read:packages), not the
          # per-run GITHUB_TOKEN - this login shares oraclevm's
          # ~/.docker/config.json with koalasoft-infra's whole deploy
          # pipeline. A GITHUB_TOKEN here, run after a Dependabot-merged
          # CI success, was actor-scoped to dependabot[bot] and expired
          # ~1h later, breaking every other stack's `docker compose pull`.
          # See pr-preview.yml for the same fix.
          GHCR_TOKEN: ${{ secrets.GHCR_PAT }}
          GHCR_USER: flojon
