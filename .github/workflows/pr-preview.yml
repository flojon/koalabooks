name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/koalabooks-web

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write
      deployments: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push PR image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/KoalaBooks.Web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache

      - name: Build and push PR client image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/KoalaBooks.Client/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/koalabooks-client:pr-${{ github.event.pull_request.number }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/koalabooks-client:buildcache

      - name: Copy compose template to VM
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.pr-preview.yml"
          target: /opt/koalabooks

      - name: Copy db-init scripts to VM
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "db-init/*"
          target: /opt/koalabooks/db-init
          strip_components: 1

      - name: Deploy PR environment
        uses: appleboy/ssh-action@v1
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OWNER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: PR_NUMBER,OWNER,GHCR_TOKEN,GHCR_USER
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            mkdir -p /opt/koalabooks/pr-${PR_NUMBER}/secrets
            SECRET_FILE=/opt/koalabooks/pr-${PR_NUMBER}/secrets/postgres_password
            APP_USER_SECRET_FILE=/opt/koalabooks/pr-${PR_NUMBER}/secrets/app_user_password
            # The volume can outlive the secrets file (e.g. dir recreated without `down -v`).
            VOLUME_EXISTS=false
            if [ -n "$(docker volume ls -q --filter "label=com.docker.compose.project=pr-${PR_NUMBER}" --filter "label=com.docker.compose.volume=postgres-data")" ]; then
              VOLUME_EXISTS=true
            fi
            NEW_SECRET=false
            if [ ! -f "$SECRET_FILE" ]; then
              openssl rand -hex 24 > "$SECRET_FILE"
              chmod 600 "$SECRET_FILE"
              # docker compose (non-Swarm) bind-mounts file secrets preserving host
              # ownership; it ignores `mode`/`uid`/`gid` on the secret. The web image
              # runs as uid 1654 (aspnet chiseled), so the file must be owned by that
              # uid or the container can't read its own secret and crash-loops.
              sudo chown 1654:1654 "$SECRET_FILE"
              NEW_SECRET=true
            fi
            APP_USER_NEW_SECRET=false
            if [ ! -f "$APP_USER_SECRET_FILE" ]; then
              openssl rand -hex 24 > "$APP_USER_SECRET_FILE"
              # Unlike postgres_password (read via POSTGRES_PASSWORD_FILE while the
              # postgres container is still root, before it gosu's to the postgres
              # user), this file is read by db-init/01-create-app-user.sh, which
              # runs *after* that privilege drop - so it must be world-readable
              # rather than locked to uid 1654 like the web-only secret above.
              chmod 644 "$APP_USER_SECRET_FILE"
              sudo chown 1654:1654 "$APP_USER_SECRET_FILE"
              APP_USER_NEW_SECRET=true
            fi
            sed \
              -e "s/__PR_NUMBER__/${PR_NUMBER}/g" \
              -e "s/__OWNER__/${OWNER}/g" \
              /opt/koalabooks/docker-compose.pr-preview.yml \
              > /opt/koalabooks/pr-${PR_NUMBER}/docker-compose.yml
            # docker-compose.yml mounts ./db-init relative to the per-PR directory,
            # so the shared template copied above needs to land there too. A prior
            # compose run may have auto-created this as a root-owned bind-mount
            # point, so use sudo rather than assume the deploy user can write to it.
            sudo mkdir -p /opt/koalabooks/pr-${PR_NUMBER}/db-init
            sudo cp -f /opt/koalabooks/db-init/* /opt/koalabooks/pr-${PR_NUMBER}/db-init/
            printf 'pr-%s.books.koalasoft.se {\n    @backend path /api/* /connect/* /hangfire /hangfire/*\n    reverse_proxy @backend pr-%s-web-1:8080\n    reverse_proxy pr-%s-client-1:80\n}\n' \
              "${PR_NUMBER}" "${PR_NUMBER}" "${PR_NUMBER}" \
              > /opt/koalabooks/caddy-snippets/pr-${PR_NUMBER}.caddy
            cd /opt/koalabooks/pr-${PR_NUMBER}
            docker compose -p pr-${PR_NUMBER} pull
            if [ "$NEW_SECRET" = true ] && [ "$VOLUME_EXISTS" = true ]; then
              # Existing volume ignores the new POSTGRES_PASSWORD_FILE, so sync it
              # into the DB directly (via local-socket trust auth) before starting web.
              # Sent over stdin (not -c) so the password is never a process argument,
              # and log_statement is disabled first so it never hits the Postgres log.
              docker compose -p pr-${PR_NUMBER} up -d --wait --wait-timeout 60 postgres
              printf '%s\n' \
                "SET log_statement = 'none';" \
                "ALTER USER koalabooks WITH PASSWORD '$(cat "$SECRET_FILE")';" \
                | docker exec -i pr-${PR_NUMBER}-postgres-1 psql -U koalabooks -d koalabooks
            fi
            if [ "$APP_USER_NEW_SECRET" = true ] && [ "$VOLUME_EXISTS" = true ]; then
              # Same desync scenario as above, for the app_user role.
              # Pre-#323 volumes have no app_user role yet; without ON_ERROR_STOP,
              # psql reports that error and still exits 0, so it doesn't fail this
              # deploy. Those volumes are recreated per the plan's Manual Rollout
              # section, not fixed up here.
              docker compose -p pr-${PR_NUMBER} up -d --wait --wait-timeout 60 postgres
              printf '%s\n' \
                "SET log_statement = 'none';" \
                "ALTER USER app_user WITH PASSWORD '$(cat "$APP_USER_SECRET_FILE")';" \
                | docker exec -i pr-${PR_NUMBER}-postgres-1 psql -U koalabooks -d koalabooks
            fi
            docker compose -p pr-${PR_NUMBER} up -d
            docker exec koalabooks-caddy-1 caddy reload --config /etc/caddy/Caddyfile

      - name: Health check preview
        id: healthcheck
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          url="https://pr-${PR_NUMBER}.books.koalasoft.se"
          code="000"
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url" || echo "000")
            if [ "$code" -ge 200 ] 2>/dev/null && [ "$code" -lt 400 ]; then
              echo "status=success" >> "$GITHUB_OUTPUT"
              echo "http_code=$code" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo "status=failure" >> "$GITHUB_OUTPUT"
          echo "http_code=$code" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Create deployment
        id: create_deployment
        uses: actions/github-script@v9
        with:
          result-encoding: string
          script: |
            const { data: deployment } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha,
              environment: `pr-${context.payload.pull_request.number}`,
              auto_merge: false,
              required_contexts: [],
              transient_environment: true,
              production_environment: false,
            });
            return deployment.id;

      - name: Set deployment status
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const url = `https://pr-${prNumber}.books.koalasoft.se`;
            const healthy = '${{ steps.healthcheck.outputs.status }}' === 'success';
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.create_deployment.outputs.result }},
              state: healthy ? 'success' : 'failure',
              environment_url: url,
              description: healthy ? 'Preview is responding' : 'Preview failed health check',
            });

      - name: Post or update PR comment
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const url = `https://pr-${prNumber}.books.koalasoft.se`;
            const sha = context.payload.pull_request.head.sha.substring(0, 7);
            const healthy = '${{ steps.healthcheck.outputs.status }}' === 'success';
            const httpCode = '${{ steps.healthcheck.outputs.http_code }}';
            const statusLine = healthy
              ? `✅ \`${sha}\` deployed and responding`
              : `⚠️ \`${sha}\` deployed but not responding (HTTP ${httpCode})`;
            const timestamp = new Date().toISOString();
            const body = `<!-- pr-preview -->\n🚀 **Preview:** [${url}](${url})\n\n${statusLine} — last updated ${timestamp}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c => c.body.includes('<!-- pr-preview -->'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

      - name: Fail job if preview is unhealthy
        if: steps.healthcheck.outputs.status != 'success'
        run: exit 1

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write

    steps:
      - name: Tear down PR environment
        uses: appleboy/ssh-action@v1
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OWNER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: PR_NUMBER,OWNER,GHCR_TOKEN,GHCR_USER
          script: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            if [ -d /opt/koalabooks/pr-${PR_NUMBER} ]; then
              cd /opt/koalabooks/pr-${PR_NUMBER}
              docker compose -p pr-${PR_NUMBER} down -v || true
            fi
            docker rmi ghcr.io/${OWNER}/koalabooks-web:pr-${PR_NUMBER} || true
            docker rmi ghcr.io/${OWNER}/koalabooks-client:pr-${PR_NUMBER} || true
            rm -f /opt/koalabooks/caddy-snippets/pr-${PR_NUMBER}.caddy
            rm -rf /opt/koalabooks/pr-${PR_NUMBER}
            docker exec koalabooks-caddy-1 caddy reload --config /etc/caddy/Caddyfile

      - name: Delete GHCR package version
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const tag = `pr-${prNumber}`;
            try {
              const { data: versions } = await github.rest.packages.getAllPackageVersionsForPackageOwnedByUser({
                package_type: 'container',
                package_name: 'koalabooks-web',
                username: context.repo.owner,
              });
              const version = versions.find(v => (v.metadata?.container?.tags ?? []).includes(tag));
              if (version) {
                await github.rest.packages.deletePackageVersionForUser({
                  package_type: 'container',
                  package_name: 'koalabooks-web',
                  username: context.repo.owner,
                  package_version_id: version.id,
                });
                console.log(`Deleted GHCR version for ${tag}`);
              } else {
                console.log(`No GHCR version found for ${tag}`);
              }
            } catch (e) {
              console.log(`Could not delete GHCR version: ${e.message}`);
            }

      - name: Delete GHCR client package version
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const tag = `pr-${prNumber}`;
            try {
              const { data: versions } = await github.rest.packages.getAllPackageVersionsForPackageOwnedByUser({
                package_type: 'container',
                package_name: 'koalabooks-client',
                username: context.repo.owner,
              });
              const version = versions.find(v => (v.metadata?.container?.tags ?? []).includes(tag));
              if (version) {
                await github.rest.packages.deletePackageVersionForUser({
                  package_type: 'container',
                  package_name: 'koalabooks-client',
                  username: context.repo.owner,
                  package_version_id: version.id,
                });
                console.log(`Deleted GHCR version for ${tag}`);
              } else {
                console.log(`No GHCR version found for ${tag}`);
              }
            } catch (e) {
              console.log(`Could not delete GHCR version: ${e.message}`);
            }

      - name: Delete PR preview comment
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const preview = comments.find(c => c.body.includes('<!-- pr-preview -->'));
            if (preview) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: preview.id,
              });
            }
