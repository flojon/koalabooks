name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/koalabooks-web

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push PR image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/KoalaBooks.Web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache

      - name: Copy compose template to VM
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.pr-preview.yml"
          target: /opt/koalabooks

      - name: Deploy PR environment
        uses: appleboy/ssh-action@v1
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OWNER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: PR_NUMBER,OWNER,GHCR_TOKEN,GHCR_USER
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            mkdir -p /opt/koalabooks/pr-${PR_NUMBER}/secrets
            SECRET_FILE=/opt/koalabooks/pr-${PR_NUMBER}/secrets/postgres_password
            # A prior redeploy's Postgres data volume can outlive the secrets file
            # (e.g. the pr-${PR_NUMBER} directory got recreated without a matching
            # `down -v`). Detect that case by Compose's own project/volume labels
            # rather than guessing the generated volume name.
            VOLUME_EXISTS=false
            if [ -n "$(docker volume ls -q --filter "label=com.docker.compose.project=pr-${PR_NUMBER}" --filter "label=com.docker.compose.volume=postgres-data")" ]; then
              VOLUME_EXISTS=true
            fi
            NEW_SECRET=false
            if [ ! -f "$SECRET_FILE" ]; then
              openssl rand -hex 24 > "$SECRET_FILE"
              chmod 600 "$SECRET_FILE"
              # docker compose (non-Swarm) bind-mounts file secrets preserving host
              # ownership; it ignores `mode`/`uid`/`gid` on the secret. The web image
              # runs as uid 1654 (aspnet chiseled), so the file must be owned by that
              # uid or the container can't read its own secret and crash-loops.
              sudo chown 1654:1654 "$SECRET_FILE"
              NEW_SECRET=true
            fi
            sed \
              -e "s/__PR_NUMBER__/${PR_NUMBER}/g" \
              -e "s/__OWNER__/${OWNER}/g" \
              /opt/koalabooks/docker-compose.pr-preview.yml \
              > /opt/koalabooks/pr-${PR_NUMBER}/docker-compose.yml
            printf 'pr-%s.books.koalasoft.se {\n    reverse_proxy pr-%s-web-1:8080\n}\n' \
              "${PR_NUMBER}" "${PR_NUMBER}" \
              > /opt/koalabooks/caddy-snippets/pr-${PR_NUMBER}.caddy
            cd /opt/koalabooks/pr-${PR_NUMBER}
            docker compose -p pr-${PR_NUMBER} pull
            if [ "$NEW_SECRET" = true ] && [ "$VOLUME_EXISTS" = true ]; then
              # Postgres only reads POSTGRES_PASSWORD_FILE while initializing a brand-new
              # empty volume, so the freshly generated password above won't take effect
              # on its own here. Bring Postgres up on whatever password is already baked
              # into the volume, then explicitly sync it to the new value before starting
              # the web container, so the two stay in sync. `set -e` above means this
              # step aborts the deploy (rather than silently starting web with a password
              # Postgres was never synced to) if the wait times out or the ALTER fails.
              # Relies on the postgres image's default local-socket trust auth so this
              # works without knowing the old password; would need adjusting if
              # docker-compose.pr-preview.yml ever sets POSTGRES_HOST_AUTH_METHOD.
              docker compose -p pr-${PR_NUMBER} up -d --wait --wait-timeout 60 postgres
              docker exec pr-${PR_NUMBER}-postgres-1 psql -U koalabooks -d koalabooks -c \
                "ALTER USER koalabooks WITH PASSWORD '$(cat "$SECRET_FILE")';"
            fi
            docker compose -p pr-${PR_NUMBER} up -d
            docker exec koalabooks-caddy-1 caddy reload --config /etc/caddy/Caddyfile

      - name: Post or update PR comment
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const url = `https://pr-${prNumber}.books.koalasoft.se`;
            const body = `<!-- pr-preview -->\n🚀 **Preview deployed:** [${url}](${url})`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c => c.body.includes('<!-- pr-preview -->'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write

    steps:
      - name: Tear down PR environment
        uses: appleboy/ssh-action@v1
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OWNER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: PR_NUMBER,OWNER,GHCR_TOKEN,GHCR_USER
          script: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            if [ -d /opt/koalabooks/pr-${PR_NUMBER} ]; then
              cd /opt/koalabooks/pr-${PR_NUMBER}
              docker compose -p pr-${PR_NUMBER} down -v || true
            fi
            docker rmi ghcr.io/${OWNER}/koalabooks-web:pr-${PR_NUMBER} || true
            rm -f /opt/koalabooks/caddy-snippets/pr-${PR_NUMBER}.caddy
            rm -rf /opt/koalabooks/pr-${PR_NUMBER}
            docker exec koalabooks-caddy-1 caddy reload --config /etc/caddy/Caddyfile

      - name: Delete GHCR package version
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const tag = `pr-${prNumber}`;
            try {
              const { data: versions } = await github.rest.packages.getAllPackageVersionsForPackageOwnedByUser({
                package_type: 'container',
                package_name: 'koalabooks-web',
                username: context.repo.owner,
              });
              const version = versions.find(v => (v.metadata?.container?.tags ?? []).includes(tag));
              if (version) {
                await github.rest.packages.deletePackageVersionForUser({
                  package_type: 'container',
                  package_name: 'koalabooks-web',
                  username: context.repo.owner,
                  package_version_id: version.id,
                });
                console.log(`Deleted GHCR version for ${tag}`);
              } else {
                console.log(`No GHCR version found for ${tag}`);
              }
            } catch (e) {
              console.log(`Could not delete GHCR version: ${e.message}`);
            }

      - name: Delete PR preview comment
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const preview = comments.find(c => c.body.includes('<!-- pr-preview -->'));
            if (preview) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: preview.id,
              });
            }
