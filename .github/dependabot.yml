version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    ignore:
      # Aspire.Hosting.* packages must stay version-locked to the Aspire.AppHost.Sdk
      # version in KoalaBooks.AppHost.csproj, which Dependabot can't see or bump.
      # The aspire-update.yml workflow owns these instead, via `aspire update`,
      # so the two can't drift apart again.
      - dependency-name: "Aspire.Hosting.*"
      # Microsoft.OpenApi 3.x reworked its model types to be read-only and
      # isn't supported by Microsoft.AspNetCore.OpenApi yet (ASP.NET Core
      # 10's source generator writes to properties that are read-only on
      # 3.x's IOpenApiMediaType, so the build fails). Stay on 2.x until a
      # Microsoft.AspNetCore.OpenApi release supports OpenApi 3.x.
      - dependency-name: "Microsoft.OpenApi"
        versions: [">= 3.0.0"]
    groups:
      microsoft-aspire:
        patterns:
          - "Microsoft.*"
          - "Aspire.*"
      opentelemetry:
        patterns:
          - "OpenTelemetry.*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10

  - package-ecosystem: docker
    directory: /src/KoalaBooks.Web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
