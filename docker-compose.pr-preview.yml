services:
  web:
    image: ghcr.io/__OWNER__/koalabooks-web:pr-__PR_NUMBER__
    environment:
      - ConnectionStrings__koalabooks=Host=postgres;Port=5432;Database=koalabooks;Username=koalabooks
      - KOALABOOKS_DB_PASSWORD_FILE=/run/secrets/postgres_password
      - ASPNETCORE_ENVIRONMENT=Staging
      - ASPNETCORE_URLS=http://+:8080
      - SEED_DEMO_DATA=true
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - pr-previews

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: koalabooks
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: koalabooks
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koalabooks"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

networks:
  internal:
  pr-previews:
    external: true

volumes:
  postgres-data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
