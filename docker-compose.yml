services:
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    environment:
      - DASHBOARD__OTLP__AUTHMODE=Unsecured
      - ASPNETCORE_URLS=http://+:18888
      - DASHBOARD__FRONTEND__AUTHMODE=OpenIdConnect
      - Authentication__Schemes__OpenIdConnect__Authority=https://books.koalasoft.se
      - Authentication__Schemes__OpenIdConnect__ClientId=aspire-dashboard
      - Authentication__Schemes__OpenIdConnect__ClientSecret=${ASPIRE_DASHBOARD_OIDC_CLIENT_SECRET}
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
    restart: unless-stopped

  web:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-local}/koalabooks-web:latest
    build:
      context: .
      dockerfile: src/KoalaBooks.Web/Dockerfile

    environment:
      - ConnectionStrings__koalabooks=Host=postgres;Port=5432;Database=koalabooks;Username=koalabooks;Password=${POSTGRES_PASSWORD}
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      # http:// intentional: ASPNETCORE_FORWARDEDHEADERS_ENABLED only trusts loopback proxies by default,
      # so Caddy (Docker bridge) cannot override the scheme. Caddy 301s http→https preserving the query
      # string, so the OIDC code exchange still completes over HTTPS end-to-end.
      - AspireDashboard__OidcRedirectUri=http://dashboard.koalasoft.se/signin-oidc
      - AspireDashboard__OidcClientSecret=${ASPIRE_DASHBOARD_OIDC_CLIENT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: koalabooks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: koalabooks
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koalabooks"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
