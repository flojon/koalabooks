services:
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    environment:
      - DASHBOARD__OTLP__AUTHMODE=Unsecured
      - ASPNETCORE_URLS=http://+:18888
      - DASHBOARD__FRONTEND__AUTHMODE=OpenIdConnect
      - Authentication__Schemes__OpenIdConnect__Authority=https://books.koalasoft.se
      - Authentication__Schemes__OpenIdConnect__ClientId=aspire-dashboard
      - Authentication__Schemes__OpenIdConnect__ClientSecret=${ASPIRE_DASHBOARD_OIDC_CLIENT_SECRET}
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
    restart: unless-stopped

  web:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-local}/koalabooks-web:latest
    build:
      context: .
      dockerfile: src/KoalaBooks.Web/Dockerfile

    environment:
      - ConnectionStrings__koalabooks=Host=postgres;Port=5432;Database=koalabooks;Username=koalabooks
      - KOALABOOKS_DB_PASSWORD_FILE=/run/secrets/postgres_password
      - ASPNETCORE_ENVIRONMENT=Production
      # Stopgap admin bootstrap until #212 lands a real role-management UI.
      - AdminSeed__Email=jonas@floden.co
      - ASPNETCORE_URLS=http://+:8080
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      # Path is "/", not "/signin-oidc" - the dashboard's own OIDC callback path is its root.
      - AspireDashboard__OidcRedirectUri=https://dashboard.koalasoft.se/
      - AspireDashboard__OidcClientSecret=${ASPIRE_DASHBOARD_OIDC_CLIENT_SECRET}
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: koalabooks
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: koalabooks
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koalabooks"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./caddy-snippets:/etc/caddy/snippets
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - default
      - pr-previews
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

networks:
  pr-previews:
    external: true

secrets:
  # File must be owned by uid 1654 (the web image's non-root user) - Compose
  # bind-mounts it preserving host ownership and ignores mode/uid/gid outside Swarm.
  postgres_password:
    file: ./secrets/postgres_password
